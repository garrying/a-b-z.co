version: 2
jobs:
  build:
    docker:
      - image: circleci/ruby:2.4.1
    environment:
      - NOKOGIRI_USE_SYSTEM_LIBRARIES: true
    steps:
      - checkout
      - run:
          name: Bundle Install
          command: gem install bundler && bundle install
      - run:
          name: Jekyll Build
          command: bundle exec jekyll build
  test:
    steps:
      - run: HTMLProofer Test
        command: bundle exec htmlproofer ./_site --check-html
