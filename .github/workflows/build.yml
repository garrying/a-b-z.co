name: Build Jekyll

on:
  push:
    branches: ["main"]

  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 10.15.0
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Persist build
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: |
            ./
            !./node_modules
  build:
    runs-on: ubuntu-latest
    needs: build-js
    steps:
      - name: Get build
        uses: actions/download-artifact@v3
        with:
          name: build
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Persist build
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: ./
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Get build
        uses: actions/download-artifact@v3
        with:
          name: build
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6.1
          bundler-cache: true
      - name: Test
        run: bundle exec htmlproofer ./_site --check-html
