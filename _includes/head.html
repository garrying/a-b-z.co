<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>

  <meta property="og:title" content="{{ site.title | escape }}" />
  <meta name="description" content="{{ site.description }}" />
  <meta property="og:description" content="{{ site.description }}" />
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}" />
  <meta property="og:url" content="{{ site.url }}" />
  <meta property="og:site_name" content="{{ site.title | escape }}" />
  <meta property="og:image" content="{{ site.url }}/img/abz-logo.png" />
  <meta name="twitter:title" content="{{ site.title | escape }}" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:site" content="@abz_co" />
  <meta name="twitter:image" content="{{ site.url }}/img/abz-logo.png" />
  <meta name="theme-color" content="#a3f0b7" />

  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}?{{site.time | date: '%s%N'}}">
</head>
